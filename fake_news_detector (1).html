    // Tokenizer: Converts text to numbers based on learned vocabulary
    function createVocabulary(data) {
        const counts = new Map();
        data.forEach(item => {
            const tokens = item.text.toLowerCase().replace(/[^\w\s]/gi, '').split(/\s+/).filter(Boolean);
            tokens.forEach(word => counts.set(word, (counts.get(word) || 0) + 1));
        });
        // Keep only the most frequent words so the embedding table stays a sane size
        vocabulary = Array.from(counts.entries())
            .sort((a, b) => b[1] - a[1])
            .slice(0, VOCAB_SIZE)
            .map(entry => entry[0]);
    }

    function textToSequence(text) {
        const tokens = text.toLowerCase().replace(/[^\w\s]/gi, '').split(/\s+/);
        const sequence = tokens.map(word => {
            const index = vocabulary.indexOf(word);
            return index !== -1 ? index + 1 : 0; // 0 for unknown words
        });
        
        // Pad or truncate sequence to fixed length MAX_LEN
        if (sequence.length > MAX_LEN) {
            return sequence.slice(0, MAX_LEN);
        }
        while (sequence.length < MAX_LEN) {
            sequence.push(0);
        }
        return sequence;
    }

            callbacks: {
                onEpochEnd: (epoch, logs) => {
                    status.innerText = `Status: Training... Epoch ${epoch + 1}/${EPOCHS} - ` +
                        `Acc: ${(logs.acc * 100).toFixed(1)}% - Val Acc: ${(logs.val_acc * 100).toFixed(1)}% - Loss: ${logs.loss.toFixed(4)}`;
                }
            }
        });

        status.innerText = "Status: Training Complete! You can test texts now.";
        document.getElementById('predictBtn').disabled = false;
        
        // Clean up memory
        xs.dispose();
        ys.dispose();
    }

    function predictNews() {
        const text = document.getElementById('newsInput').value;
        const resultDiv = document.getElementById('result');

        if (!text.trim()) {
            resultDiv.innerText = "Please enter some text first.";
            return;
        }

        // Convert user input to sequence tensor
        const seq = textToSequence(text);
        const inputTensor = tf.tensor2d([seq], [1, MAX_LEN]);

        // Predict using trained model
        const prediction = model.predict(inputTensor);
        const score = prediction.dataSync()[0]; // Value between 0 and 1

        // Display results (0 = Fake, 1 = Real)
        const realPercentage = (score * 100).toFixed(2);
        const fakePercentage = ((1 - score) * 100).toFixed(2);

        if (score > 0.5) {
            resultDiv.innerHTML = `Result: <span class="real">REAL NEWS</span> (Confidence: ${realPercentage}%)`;
        } else {
            resultDiv.innerHTML = `Result: <span class="fake">FAKE NEWS</span> (Confidence: ${fakePercentage}%)`;
        }

        inputTensor.dispose();
        prediction.dispose();
    }
</script>

</body>
</html>
